:root[data-theme=&quot;light&quot;] {

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;

* {

}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );

    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))

  padding: 5px;

  background: transparent !important;

  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);

  text-decoration: none;
  text-underline-offset: 2px;

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;

h2,
h3,
h4,
h5,
h6,

}

h3,

h5,

}

b,
strong,
th {

}

code:not(pre code) {

}

.table-responsive {
  width: 100%;
  overflow-x: auto;

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {

}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {

}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;

  pointer-events: none;
  user-select: none;

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

.text-muted {

}

.sr-only {

  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;

.viz-controls {

  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

  grid-column: 1 / -1;

.btn,
.form-check-input,
.form-control,

}

.btn {

  min-height: 28px;
  align-items: center;

a.btn {

  text-decoration: none;

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;

  background: color-mix(in srgb, var(--foreground) 80%, transparent);

  opacity: 0.4;

  margin-bottom: 6px;

.form-select:focus-visible {

.form-check:not(.form-switch)

  display: block;

  height: 100%;

  width: 14px;
  height: 14px;

}

.form-check-input[type=&quot;radio&quot;]:checked {

  outline: 2px solid var(--ring);

}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;

.form-check-label {

}

.form-switch .form-check-input::before {
  position: absolute;

  left: 0;

  height: 16px;

  box-shadow: var(--shadow-sm);

  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);

.form-range {

  height: 28px;

  padding: 0;

  height: 28px;

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);

}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {

.btn:focus-visible {

}

svg {

  height: auto;
}

#widget &gt; svg {

}

svg.lucide {

  flex: none;
  margin: 0 !important;

}

.text-destructive {
  color: var(--destructive);
}

  &lt;script&gt;
    (function () {
      &quot;use strict&quot;;
      const root = document.getElementById(&quot;feishu-persona-atlas&quot;);
      const people = [
        { id: &quot;PA-001&quot;, name: &quot;楚云&quot;, alias: &quot;界面构筑者&quot;, role: &quot;产品设计师&quot;, domain: &quot;设计&quot;, sources: [&quot;消息&quot;, &quot;会议&quot;], recent: true, favorite: true, hidden: false, initials: &quot;楚&quot;, topics: [&quot;交互设计&quot;, &quot;用户研究&quot;, &quot;设计系统&quot;], evidence: 12, meetings: 5, confidence: &quot;高&quot;, summary: &quot;擅长把模糊需求拆成可验证的界面路径，会主动指出体验断点并给出结构化方案。&quot;, style: &quot;先确认用户任务，再讨论视觉表达&quot;, quote: &quot;我们先把首次使用的那一分钟走顺。&quot; },
        { id: &quot;PA-002&quot;, name: &quot;林岳&quot;, alias: &quot;架构巡游者&quot;, role: &quot;后端工程师&quot;, domain: &quot;技术&quot;, sources: [&quot;消息&quot;, &quot;会议&quot;], recent: true, favorite: false, hidden: false, initials: &quot;林&quot;, topics: [&quot;服务架构&quot;, &quot;稳定性&quot;, &quot;性能&quot;], evidence: 15, meetings: 7, confidence: &quot;高&quot;, summary: &quot;关注系统边界与长期维护成本，讨论方案时会快速定位不可逆的技术决策。&quot;, style: &quot;先画清数据流，再进入实现细节&quot;, quote: &quot;这个状态该由谁持有，先说清楚。&quot; },
        { id: &quot;PA-003&quot;, name: &quot;周奕&quot;, alias: &quot;需求校准者&quot;, role: &quot;产品经理&quot;, domain: &quot;产品&quot;, sources: [&quot;消息&quot;, &quot;会议&quot;], recent: true, favorite: true, hidden: false, initials: &quot;周&quot;, topics: [&quot;需求分析&quot;, &quot;增长实验&quot;, &quot;路线图&quot;], evidence: 18, meetings: 9, confidence: &quot;高&quot;, summary: &quot;能把讨论拉回用户价值与上线目标，对范围控制敏感，偏好小步验证。&quot;, style: &quot;用真实场景压测需求优先级&quot;, quote: &quot;如果只能解决一个问题，用户最痛的是哪个？&quot; },
        { id: &quot;PA-004&quot;, name: &quot;顾遥&quot;, alias: &quot;质量守门人&quot;, role: &quot;测试工程师&quot;, domain: &quot;技术&quot;, sources: [&quot;消息&quot;], recent: false, favorite: false, hidden: false, initials: &quot;顾&quot;, topics: [&quot;质量保障&quot;, &quot;自动化&quot;, &quot;边界场景&quot;], evidence: 9, meetings: 2, confidence: &quot;中&quot;, summary: &quot;善于从用户输入和异常状态中寻找断点，反馈通常带有明确复现步骤。&quot;, style: &quot;先固定复现条件，再判断影响范围&quot;, quote: &quot;正常路径没问题，我们来看看中途取消会怎样。&quot; },
        { id: &quot;PA-005&quot;, name: &quot;沈玥&quot;, alias: &quot;叙事点火者&quot;, role: &quot;品牌内容负责人&quot;, domain: &quot;产品&quot;, sources: [&quot;消息&quot;, &quot;会议&quot;], recent: true, favorite: false, hidden: false, initials: &quot;沈&quot;, topics: [&quot;品牌叙事&quot;, &quot;内容策略&quot;, &quot;发布&quot;], evidence: 10, meetings: 4, confidence: &quot;中&quot;, summary: &quot;擅长把技术能力转换成用户能记住的故事，对命名、节奏和首屏信息密度很敏感。&quot;, style: &quot;从一句能被复述的话开始组织内容&quot;, quote: &quot;功能不是主角，用户完成的事才是。&quot; },
        { id: &quot;PA-006&quot;, name: &quot;唐骁&quot;, alias: &quot;交付推进者&quot;, role: &quot;项目负责人&quot;, domain: &quot;产品&quot;, sources: [&quot;消息&quot;, &quot;会议&quot;], recent: false, favorite: false, hidden: false, initials: &quot;唐&quot;, topics: [&quot;项目管理&quot;, &quot;风险&quot;, &quot;跨组协同&quot;], evidence: 14, meetings: 8, confidence: &quot;高&quot;, summary: &quot;擅长拆解依赖、确认责任人与时间点，出现阻塞时会优先建立最短恢复路径。&quot;, style: &quot;用清晰的责任边界换取推进速度&quot;, quote: &quot;现在卡住的是决定，还是执行？&quot; },
        { id: &quot;PA-007&quot;, name: &quot;叶澄&quot;, alias: &quot;数据观测者&quot;, role: &quot;数据分析师&quot;, domain: &quot;技术&quot;, sources: [&quot;消息&quot;], recent: false, favorite: false, hidden: false, initials: &quot;叶&quot;, topics: [&quot;指标体系&quot;, &quot;行为分析&quot;, &quot;实验设计&quot;], evidence: 8, meetings: 1, confidence: &quot;中&quot;, summary: &quot;会追问指标定义、样本偏差和结论边界，倾向先建立可观测性再评价效果。&quot;, style: &quot;把判断转写为能被数据证伪的问题&quot;, quote: &quot;这个增长来自更多用户，还是更高频次？&quot; },
        { id: &quot;PA-008&quot;, name: &quot;许棠&quot;, alias: &quot;关系连接者&quot;, role: &quot;用户运营&quot;, domain: &quot;产品&quot;, sources: [&quot;消息&quot;, &quot;会议&quot;], recent: false, favorite: false, hidden: false, initials: &quot;许&quot;, topics: [&quot;用户运营&quot;, &quot;社群&quot;, &quot;反馈闭环&quot;], evidence: 11, meetings: 3, confidence: &quot;中&quot;, summary: &quot;熟悉核心用户的真实语境，能快速匹配合适的访谈对象并建立反馈闭环。&quot;, style: &quot;先找具体的人，再讨论抽象的人群&quot;, quote: &quot;我知道三位用户正好遇到过这个问题。&quot; }
      ];
      const initialPeople = JSON.parse(JSON.stringify(people));
      const storageKey = &quot;feishu-persona-atlas-demo-v1&quot;;
      const state = { index: 0, query: &quot;&quot;, collection: &quot;all&quot;, domain: &quot;all&quot;, source: &quot;&quot;, scanProgress: 0, scanTimer: null, paused: false, resyncing: false, scanMode: &quot;normal&quot;, demoLimit: null, partial: false, visible: [], lastFocused: null, pointerStartX: null };

      function persistDemo() {
        try {
          window.sessionStorage.setItem(storageKey, JSON.stringify({
            screen: root.dataset.screen,
            scanProgress: state.scanProgress,
            paused: state.paused,
            resyncing: state.resyncing,
            demoLimit: state.demoLimit,
            partial: state.partial,
            people: people
          }));
        } catch (error) {
          return;
        }
      }

      function clearPersistedDemo() {
        try {
          window.sessionStorage.removeItem(storageKey);
        } catch (error) {
          return;
        }
      }

      function refreshIcons() {
        if (window.lucide &amp;&amp; typeof window.lucide.createIcons === &quot;function&quot;) {
          window.lucide.createIcons({ attrs: { &quot;stroke-width&quot;: 1.8 } });
        }
      }

      function setScreen(screen) {
        root.dataset.screen = screen;
        if (screen !== &quot;scan&quot;) stopScan();
        persistDemo();
      }

      function showToast(message) {
        const toast = root.querySelector(&quot;#atlas-toast&quot;);
        toast.textContent = message;
        toast.classList.add(&quot;is-visible&quot;);
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(function hideToast() { toast.classList.remove(&quot;is-visible&quot;); }, 2200);
      }

      function getFilteredPeople() {
        const matches = people.filter(function filterPerson(person) {
          const query = state.query.toLowerCase();
          const matchesQuery = !query || [person.name, person.alias, person.role].concat(person.topics).join(&quot; &quot;).toLowerCase().includes(query);
          let matchesCollection = !person.hidden;
          if (state.collection === &quot;favorite&quot;) matchesCollection = person.favorite &amp;&amp; !person.hidden;
          if (state.collection === &quot;recent&quot;) matchesCollection = person.recent &amp;&amp; !person.hidden;
          if (state.collection === &quot;hidden&quot;) matchesCollection = person.hidden;
          const matchesDomain = state.domain === &quot;all&quot; || person.domain === state.domain;
          const matchesSource = !state.source || person.sources.includes(state.source);
          return matchesQuery &amp;&amp; matchesCollection &amp;&amp; matchesDomain &amp;&amp; matchesSource;
        });
        if (state.demoLimit === null) return matches;
        return matches.slice(0, state.demoLimit);
      }

      function getCurrent() {
        return state.visible[state.index] || null;
      }

      function cardMarkup(person, position) {
        const fav = person.favorite ? &#x27;&lt;span class=&quot;atlas-card-fav&quot; aria-label=&quot;已收藏&quot;&gt;&lt;i data-lucide=&quot;star&quot;&gt;&lt;/i&gt;&lt;/span&gt;&#x27; : &quot;&quot;;
        return &#x27;&lt;button class=&quot;atlas-person-card&quot; type=&quot;button&quot; data-person-id=&quot;&#x27; + person.id + &#x27;&quot; data-position=&quot;&#x27; + position + &#x27;&quot; aria-label=&quot;&#x27; + person.name + &#x27;人物卡，点击翻面&quot;&gt;&#x27; +
          &#x27;&lt;span class=&quot;atlas-card-face atlas-card-front&quot;&gt;&#x27; + fav + &#x27;&lt;span class=&quot;atlas-card-number&quot;&gt;&#x27; + person.id + &#x27;&lt;/span&gt;&lt;span class=&quot;atlas-portrait&quot; data-initial=&quot;&#x27; + person.initials + &#x27;&quot;&gt;&lt;span class=&quot;atlas-portrait-line&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;atlas-card-code&quot;&gt;&#x27; + person.alias.toUpperCase() + &#x27;&lt;/span&gt;&lt;strong class=&quot;atlas-card-name&quot;&gt;&#x27; + person.name + &#x27;&lt;/strong&gt;&lt;span class=&quot;atlas-card-role&quot;&gt;&#x27; + person.role + &#x27;&lt;/span&gt;&lt;span class=&quot;atlas-card-tags&quot;&gt;&lt;span&gt;&#x27; + person.domain + &#x27;&lt;/span&gt;&lt;span&gt;证据 &#x27; + person.evidence + &#x27;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&#x27; +
          &#x27;&lt;span class=&quot;atlas-card-face atlas-card-back&quot;&gt;&lt;span class=&quot;atlas-back-id&quot;&gt;&#x27; + person.id + &#x27; / PROFILE&lt;/span&gt;&lt;strong class=&quot;atlas-back-name&quot;&gt;&#x27; + person.name + &#x27;&lt;/strong&gt;&lt;span class=&quot;atlas-back-alias&quot;&gt;代号：&#x27; + person.alias + &#x27;&lt;/span&gt;&lt;span class=&quot;atlas-back-rule&quot;&gt;&lt;/span&gt;&lt;span class=&quot;atlas-back-label&quot;&gt;COLLABORATION STYLE&lt;/span&gt;&lt;span class=&quot;atlas-back-copy&quot;&gt;&#x27; + person.style + &#x27;&lt;/span&gt;&lt;span class=&quot;atlas-back-label&quot;&gt;SIGNATURE TRACE&lt;/span&gt;&lt;span class=&quot;atlas-back-copy&quot;&gt;“&#x27; + person.quote + &#x27;”&lt;/span&gt;&lt;span class=&quot;atlas-skill&quot;&gt;&lt;span&gt;可信度&lt;/span&gt;&lt;span&gt;&#x27; + person.confidence + &#x27;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;atlas-skill&quot;&gt;&lt;span&gt;最近协作&lt;/span&gt;&lt;span&gt;&#x27; + (person.recent ? &quot;7 天内&quot; : &quot;30 天前&quot;) + &#x27;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/button&gt;&#x27;;
      }

      function detailMarkup(person) {
        return &#x27;&lt;div class=&quot;atlas-detail-top&quot;&gt;&lt;div&gt;&lt;span class=&quot;atlas-detail-label&quot;&gt;SELECTED PROFILE&lt;/span&gt;&lt;h2&gt;&#x27; + person.name + &#x27;&lt;/h2&gt;&lt;div class=&quot;atlas-detail-role&quot;&gt;&#x27; + person.role + &#x27; · &#x27; + person.alias + &#x27;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;atlas-detail-actions&quot;&gt;&lt;button class=&quot;atlas-icon-button &#x27; + (person.favorite ? &quot;is-active&quot; : &quot;&quot;) + &#x27;&quot; type=&quot;button&quot; data-action=&quot;favorite&quot; aria-label=&quot;&#x27; + (person.favorite ? &quot;取消收藏&quot; : &quot;收藏&quot;) + &#x27;&quot; title=&quot;收藏&quot;&gt;&lt;i data-lucide=&quot;star&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;button class=&quot;atlas-icon-button&quot; type=&quot;button&quot; data-action=&quot;edit&quot; aria-label=&quot;纠正人物信息&quot; title=&quot;纠正信息&quot;&gt;&lt;i data-lucide=&quot;pencil&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;button class=&quot;atlas-icon-button&quot; type=&quot;button&quot; data-action=&quot;hide-person&quot; aria-label=&quot;&#x27; + (person.hidden ? &quot;恢复人物&quot; : &quot;隐藏人物&quot;) + &#x27;&quot; title=&quot;&#x27; + (person.hidden ? &quot;恢复&quot; : &quot;隐藏&quot;) + &#x27;&quot;&gt;&lt;i data-lucide=&quot;&#x27; + (person.hidden ? &quot;eye&quot; : &quot;eye-off&quot;) + &#x27;&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&#x27; +
          &#x27;&lt;div class=&quot;atlas-stat-row&quot;&gt;&lt;div class=&quot;atlas-stat&quot;&gt;&lt;strong&gt;&#x27; + person.evidence + &#x27;&lt;/strong&gt;&lt;span&gt;有效证据&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;atlas-stat&quot;&gt;&lt;strong&gt;&#x27; + person.meetings + &#x27;&lt;/strong&gt;&lt;span&gt;共同会议&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&#x27; +
          &#x27;&lt;section class=&quot;atlas-detail-section&quot;&gt;&lt;h3&gt;协作印象 · AI 推断&lt;/h3&gt;&lt;p&gt;&#x27; + person.summary + &#x27;&lt;/p&gt;&lt;/section&gt;&#x27; +
          &#x27;&lt;section class=&quot;atlas-detail-section&quot;&gt;&lt;h3&gt;关注领域 · 事实聚合&lt;/h3&gt;&lt;div class=&quot;atlas-detail-chips&quot;&gt;&#x27; + person.topics.map(function topicTag(topic) { return &#x27;&lt;span&gt;&#x27; + topic + &#x27;&lt;/span&gt;&#x27;; }).join(&quot;&quot;) + &#x27;&lt;/div&gt;&lt;/section&gt;&#x27; +
          &#x27;&lt;section class=&quot;atlas-detail-section&quot;&gt;&lt;h3&gt;代表表达 · 演示摘录&lt;/h3&gt;&lt;p&gt;“&#x27; + person.quote + &#x27;”&lt;/p&gt;&lt;/section&gt;&#x27; +
          &#x27;&lt;button class=&quot;atlas-secondary atlas-evidence-button&quot; type=&quot;button&quot; data-action=&quot;evidence&quot;&gt;&lt;i data-lucide=&quot;file-search&quot;&gt;&lt;/i&gt; 查看 &#x27; + person.evidence + &#x27; 条证据&lt;/button&gt;&#x27;;
      }

      function renderAtlas() {
        state.visible = getFilteredPeople();
        if (state.index &gt;= state.visible.length) state.index = Math.max(0, state.visible.length - 1);
        const viewport = root.querySelector(&quot;#atlas-deck-viewport&quot;);
        const detail = root.querySelector(&quot;#atlas-detail&quot;);
        const empty = root.querySelector(&quot;#atlas-empty&quot;);
        const controls = root.querySelector(&quot;.atlas-stage-controls&quot;);
        const hint = root.querySelector(&quot;.atlas-card-hint&quot;);
        if (!state.visible.length) {
          viewport.innerHTML = &quot;&quot;;
          detail.innerHTML = &#x27;&lt;div class=&quot;atlas-detail-label&quot;&gt;NO PROFILE SELECTED&lt;/div&gt;&#x27;;
          empty.style.display = &quot;block&quot;;
          controls.style.visibility = &quot;hidden&quot;;
          hint.style.visibility = &quot;hidden&quot;;
          root.querySelector(&quot;#atlas-position&quot;).textContent = &quot;0 / 0&quot;;
        } else {
          const current = getCurrent();
          const ordered = state.visible.map(function mapPerson(person, idx) {
            let position = &quot;far&quot;;
            if (idx === state.index) position = &quot;center&quot;;
            if (idx === state.index - 1 || (state.index === 0 &amp;&amp; idx === state.visible.length - 1)) position = &quot;left&quot;;
            if (idx === state.index + 1 || (state.index === state.visible.length - 1 &amp;&amp; idx === 0)) position = &quot;right&quot;;
            return cardMarkup(person, position);
          }).join(&quot;&quot;);
          viewport.innerHTML = ordered;
          detail.innerHTML = detailMarkup(current);
          empty.style.display = &quot;none&quot;;
          controls.style.visibility = &quot;visible&quot;;
          hint.style.visibility = &quot;visible&quot;;
          root.querySelector(&quot;#atlas-position&quot;).textContent = (state.index + 1) + &quot; / &quot; + state.visible.length;
        }
        root.querySelector(&quot;#atlas-result-count&quot;).textContent = state.visible.length + &quot; 张卡片&quot;;
        if (state.partial) root.querySelector(&quot;#atlas-result-count&quot;).textContent += &quot;，部分结果&quot;;
        root.querySelector(&quot;#atlas-count-fav&quot;).textContent = people.filter(function countFav(p) { return p.favorite &amp;&amp; !p.hidden; }).length;
        root.querySelector(&quot;#atlas-count-hidden&quot;).textContent = people.filter(function countHidden(p) { return p.hidden; }).length;
        refreshIcons();
        persistDemo();
      }

      function moveDeck(direction) {
        if (!state.visible.length) return;
        state.index = (state.index + direction + state.visible.length) % state.visible.length;
        renderAtlas();
      }

      function stopScan() {
        if (state.scanTimer) window.clearInterval(state.scanTimer);
        state.scanTimer = null;
      }

      function updateScanUi() {
        const progress = state.scanProgress;
        const found = Math.min(8, Math.floor(progress / 11));
        let phase = &quot;校验授权范围&quot;;
        let caption = &quot;正在确认可读取的会话与联系人范围&quot;;
        let activeLog = 0;
        if (progress &gt;= 25) { phase = &quot;聚合人物证据&quot;; caption = &quot;正在按身份合并消息、日程与协作主题&quot;; activeLog = 1; }
        if (progress &gt;= 68) { phase = &quot;生成结构化卡片&quot;; caption = &quot;正在区分事实、推断与创意角色设定&quot;; activeLog = 2; }
        root.querySelector(&quot;#atlas-found-count&quot;).textContent = found;
        root.querySelector(&quot;#atlas-progress-phase&quot;).textContent = phase;
        root.querySelector(&quot;#atlas-progress-value&quot;).textContent = progress + &quot;%&quot;;
        root.querySelector(&quot;#atlas-progress-bar&quot;).style.width = progress + &quot;%&quot;;
        root.querySelector(&quot;#atlas-scan-caption&quot;).textContent = caption;
        root.querySelectorAll(&quot;.atlas-log-item&quot;).forEach(function updateLog(item, idx) {
          item.classList.toggle(&quot;is-active&quot;, idx === activeLog);
          item.classList.toggle(&quot;is-done&quot;, idx &lt; activeLog);
          const icon = item.querySelector(&quot;svg, i&quot;);
          if (icon &amp;&amp; icon.tagName.toLowerCase() === &quot;i&quot;) icon.setAttribute(&quot;data-lucide&quot;, idx &lt; activeLog ? &quot;circle-check&quot; : (idx === activeLog ? &quot;loader-circle&quot; : &quot;circle-dashed&quot;));
        });
        refreshIcons();
        persistDemo();
      }

      function failScan() {
        stopScan();
        state.scanMode = &quot;halted&quot;;
        state.paused = true;
        root.querySelector(&quot;.atlas-scan&quot;).dataset.paused = &quot;true&quot;;
        root.querySelector(&quot;#atlas-scan-status&quot;).textContent = &quot;NEEDS ATTENTION&quot;;
        root.querySelector(&quot;#atlas-scan-caption&quot;).textContent = &quot;会议数据源响应超时，消息与通讯录结果已保留&quot;;
        root.querySelector(&quot;#atlas-scan-recovery-copy&quot;).textContent = &quot;已完成消息与通讯录聚合，可重试会议读取，也可以先查看 3 张部分结果。&quot;;
        root.querySelector(&quot;#atlas-scan-recovery&quot;).classList.add(&quot;is-visible&quot;);
        root.querySelector(&quot;.atlas-scan-actions&quot;).style.display = &quot;none&quot;;
        persistDemo();
        refreshIcons();
      }

      function finishScan() {
        stopScan();
        state.scanProgress = 100;
        state.scanMode = &quot;normal&quot;;
        root.querySelector(&quot;#atlas-scan-recovery&quot;).classList.remove(&quot;is-visible&quot;);
        root.querySelector(&quot;.atlas-scan-actions&quot;).style.display = &quot;flex&quot;;
        updateScanUi();
        window.setTimeout(function afterScan() {
          if (state.resyncing) {
            state.resyncing = false;
            setScreen(&quot;atlas&quot;);
            renderAtlas();
            showToast(&quot;假面骑事已更新，演示数据无变化&quot;);
          } else {
            setScreen(&quot;unlock&quot;);
          }
        }, 480);
      }

      function startScan(isResync, mode, initialProgress) {
        stopScan();
        state.resyncing = Boolean(isResync);
        state.scanMode = mode || &quot;normal&quot;;
        state.scanProgress = initialProgress || 0;
        state.paused = false;
        setScreen(&quot;scan&quot;);
        root.querySelector(&quot;#atlas-scan-recovery&quot;).classList.remove(&quot;is-visible&quot;);
        root.querySelector(&quot;.atlas-scan-actions&quot;).style.display = &quot;flex&quot;;
        root.querySelector(&quot;.atlas-scan&quot;).dataset.paused = &quot;false&quot;;
        root.querySelector(&quot;#atlas-scan-status&quot;).textContent = &quot;SCANNING&quot;;
        const toggle = root.querySelector(&#x27;[data-action=&quot;toggle-scan&quot;]&#x27;);
        toggle.innerHTML = &#x27;&lt;i data-lucide=&quot;pause&quot;&gt;&lt;/i&gt;&lt;span&gt;暂停&lt;/span&gt;&#x27;;
        updateScanUi();
        state.scanTimer = window.setInterval(function tickScan() {
          if (state.paused) return;
          state.scanProgress = Math.min(100, state.scanProgress + 2);
          updateScanUi();
          if (state.scanMode === &quot;error&quot; &amp;&amp; state.scanProgress &gt;= 46) { failScan(); return; }
          if (state.scanProgress &gt;= 100) finishScan();
        }, 120);
      }

      function toggleScan() {
        state.paused = !state.paused;
        root.querySelector(&quot;.atlas-scan&quot;).dataset.paused = String(state.paused);
        root.querySelector(&quot;#atlas-scan-status&quot;).textContent = state.paused ? &quot;PAUSED&quot; : &quot;SCANNING&quot;;
        root.querySelector(&quot;#atlas-scan-caption&quot;).textContent = state.paused ? &quot;扫描已暂停，当前进度已保留&quot; : &quot;正在继续聚合人物证据&quot;;
        const toggle = root.querySelector(&#x27;[data-action=&quot;toggle-scan&quot;]&#x27;);
        toggle.innerHTML = state.paused ? &#x27;&lt;i data-lucide=&quot;play&quot;&gt;&lt;/i&gt;&lt;span&gt;继续&lt;/span&gt;&#x27; : &#x27;&lt;i data-lucide=&quot;pause&quot;&gt;&lt;/i&gt;&lt;span&gt;暂停&lt;/span&gt;&#x27;;
        refreshIcons();
        persistDemo();
      }

      function openModal(id, preferredFocus) {
        state.lastFocused = document.activeElement;
        const layer = root.querySelector(id);
        layer.classList.add(&quot;is-open&quot;);
        const target = preferredFocus ? layer.querySelector(preferredFocus) : layer.querySelector(&quot;button, input, select, textarea&quot;);
        if (target) target.focus();
      }

      function openEvidence() {
        const person = getCurrent();
        if (!person) return;
        root.querySelector(&quot;#atlas-evidence-title&quot;).textContent = person.name + &quot; · 证据详情&quot;;
        root.querySelector(&quot;#atlas-evidence-id&quot;).textContent = person.id;
        const examples = [
          { icon: &quot;messages-square&quot;, source: &quot;产品讨论群&quot;, time: &quot;08-12 14:20&quot;, text: person.quote },
          { icon: &quot;calendar-days&quot;, source: &quot;项目周会&quot;, time: &quot;08-08 10:00&quot;, text: &quot;围绕“&quot; + person.topics[0] + &quot;”推进了方案确认，并补充了下一步责任人。&quot; },
          { icon: &quot;contact-round&quot;, source: &quot;通讯录资料&quot;, time: &quot;08-01 同步&quot;, text: person.role + &quot;，近期协作主题包括&quot; + person.topics.join(&quot;、&quot;) + &quot;。&quot; }
        ];
        root.querySelector(&quot;#atlas-evidence-list&quot;).innerHTML = examples.map(function evidenceItem(item) {
          return &#x27;&lt;article class=&quot;atlas-evidence-item&quot;&gt;&lt;div class=&quot;atlas-evidence-meta&quot;&gt;&lt;i data-lucide=&quot;&#x27; + item.icon + &#x27;&quot;&gt;&lt;/i&gt;&lt;strong&gt;&#x27; + item.source + &#x27;&lt;/strong&gt;&lt;span&gt;&#x27; + item.time + &#x27;&lt;/span&gt;&lt;/div&gt;&lt;p&gt;&#x27; + item.text + &#x27;&lt;/p&gt;&lt;/article&gt;&#x27;;
        }).join(&quot;&quot;);
        openModal(&quot;#atlas-evidence-modal&quot;, &#x27;[data-action=&quot;close-evidence&quot;]&#x27;);
        refreshIcons();
      }

      function openEdit() {
        const person = getCurrent();
        if (!person) return;
        const form = root.querySelector(&quot;#atlas-edit-form&quot;);
        form.elements.name.value = person.name;
        form.elements.role.value = person.role;
        form.elements.alias.value = person.alias;
        form.elements.summary.value = person.summary;
        openModal(&quot;#atlas-edit-modal&quot;, &quot;#atlas-edit-name&quot;);
      }

      function closeModal(id) {
        root.querySelector(id).classList.remove(&quot;is-open&quot;);
        if (state.lastFocused &amp;&amp; typeof state.lastFocused.focus === &quot;function&quot;) state.lastFocused.focus();
        state.lastFocused = null;
      }

      function restorePeople() {
        people.splice(0, people.length);
        initialPeople.forEach(function restorePerson(person) { people.push(JSON.parse(JSON.stringify(person))); });
        state.demoLimit = null;
        state.partial = false;
        state.index = 0;
        state.query = &quot;&quot;;
        state.collection = &quot;all&quot;;
        state.domain = &quot;all&quot;;
        state.source = &quot;&quot;;
        root.querySelector(&quot;#atlas-search-input&quot;).value = &quot;&quot;;
        setCollection(&quot;all&quot;);
        setDomain(&quot;all&quot;);
      }

      function saveEdit(event) {
        event.preventDefault();
        const person = getCurrent();
        if (!person) return;
        const form = event.currentTarget;
        person.name = form.elements.name.value.trim();
        person.role = form.elements.role.value.trim();
        person.alias = form.elements.alias.value.trim();
        person.summary = form.elements.summary.value.trim();
        closeModal(&quot;#atlas-edit-modal&quot;);
        renderAtlas();
        showToast(&quot;已保存人物纠正，本地修改优先于再次提炼&quot;);
      }

      function setCollection(value) {
        state.collection = value;
        state.index = 0;
        root.querySelectorAll(&quot;[data-collection]&quot;).forEach(function updateCollection(button) { button.setAttribute(&quot;aria-pressed&quot;, String(button.dataset.collection === value)); });
        const titles = { all: &quot;全部收录&quot;, favorite: &quot;我的收藏&quot;, recent: &quot;最近协作&quot;, hidden: &quot;已隐藏&quot; };
        root.querySelector(&quot;#atlas-list-title&quot;).textContent = titles[value];
        renderAtlas();
      }

      function setDomain(value) {
        state.domain = value;
        state.index = 0;
        root.querySelectorAll(&quot;[data-domain]&quot;).forEach(function updateDomain(button) { button.setAttribute(&quot;aria-pressed&quot;, String(button.dataset.domain === value)); });
        renderAtlas();
      }

      function handleRootClick(event) {
        const actionTarget = event.target.closest(&quot;[data-action]&quot;);
        const collectionTarget = event.target.closest(&quot;[data-collection]&quot;);
        const sourceTarget = event.target.closest(&quot;[data-source]&quot;);
        const domainTarget = event.target.closest(&quot;[data-domain]&quot;);
        const dayTarget = event.target.closest(&quot;[data-days]&quot;);
        const cardTarget = event.target.closest(&quot;.atlas-person-card&quot;);
        if (dayTarget) {
          root.querySelectorAll(&quot;[data-days]&quot;).forEach(function updateDays(button) { button.setAttribute(&quot;aria-pressed&quot;, String(button === dayTarget)); });
          return;
        }
        if (collectionTarget) { setCollection(collectionTarget.dataset.collection); return; }
        if (sourceTarget) {
          state.source = state.source === sourceTarget.dataset.source ? &quot;&quot; : sourceTarget.dataset.source;
          root.querySelectorAll(&quot;[data-source]&quot;).forEach(function updateSource(button) { button.setAttribute(&quot;aria-pressed&quot;, String(button.dataset.source === state.source)); });
          state.index = 0;
          renderAtlas();
          return;
        }
        if (domainTarget) { setDomain(domainTarget.dataset.domain); return; }
        if (cardTarget) {
          const cardIndex = state.visible.findIndex(function findCard(person) { return person.id === cardTarget.dataset.personId; });
          if (cardIndex !== state.index) { state.index = cardIndex; renderAtlas(); } else { cardTarget.classList.toggle(&quot;is-flipped&quot;); }
          return;
        }
        if (!actionTarget) return;
        const action = actionTarget.dataset.action;
        if (action === &quot;begin&quot;) setScreen(&quot;scope&quot;);
        if (action === &quot;preview&quot;) { setScreen(&quot;atlas&quot;); renderAtlas(); }
        if (action === &quot;back-welcome&quot;) setScreen(&quot;welcome&quot;);
        if (action === &quot;start-scan&quot;) {
          const checked = root.querySelectorAll(&#x27;input[name=&quot;source&quot;]:checked&#x27;).length;
          if (!checked) { showToast(&quot;请至少选择一种数据来源&quot;); return; }
          startScan(false, &quot;normal&quot;, 0);
        }
        if (action === &quot;add-exclude&quot;) {
          const input = root.querySelector(&quot;#atlas-exclude-input&quot;);
          const value = input.value.trim();
          if (value) {
            const tag = document.createElement(&quot;span&quot;);
            tag.className = &quot;atlas-tag&quot;;
            tag.textContent = value;
            root.querySelector(&quot;#atlas-exclude-tags&quot;).appendChild(tag);
            input.value = &quot;&quot;;
          }
        }
        if (action === &quot;toggle-scan&quot;) toggleScan();
        if (action === &quot;cancel-scan&quot;) { stopScan(); clearPersistedDemo(); setScreen(state.resyncing ? &quot;atlas&quot; : &quot;scope&quot;); if (state.resyncing) renderAtlas(); showToast(&quot;扫描已取消，未覆盖现有人物卡&quot;); }
        if (action === &quot;scan-retry&quot;) startScan(state.resyncing, &quot;normal&quot;, state.scanProgress);
        if (action === &quot;scan-partial&quot;) {
          stopScan();
          state.demoLimit = 3;
          state.partial = true;
          state.resyncing = false;
          setScreen(&quot;atlas&quot;);
          renderAtlas();
          showToast(&quot;已保留 3 张部分结果，可随时重新扫描补全&quot;);
        }
        if (action === &quot;reveal-card&quot;) {
          actionTarget.classList.add(&quot;is-revealed&quot;);
          root.querySelector(&quot;#atlas-unlock-tip&quot;).textContent = &quot;楚云 · 界面构筑者 · 已收入图鉴&quot;;
          root.querySelector(&#x27;[data-action=&quot;enter-atlas&quot;]&#x27;).classList.add(&quot;is-visible&quot;);
        }
        if (action === &quot;enter-atlas&quot;) { setScreen(&quot;atlas&quot;); renderAtlas(); }
        if (action === &quot;resync&quot;) startScan(true, &quot;normal&quot;, 0);
        if (action === &quot;previous&quot;) moveDeck(-1);
        if (action === &quot;next&quot;) moveDeck(1);
        if (action === &quot;favorite&quot;) {
          const person = getCurrent();
          if (person) { person.favorite = !person.favorite; renderAtlas(); showToast(person.favorite ? &quot;已加入收藏&quot; : &quot;已取消收藏&quot;); }
        }
        if (action === &quot;hide-person&quot;) {
          const person = getCurrent();
          if (person) { person.hidden = !person.hidden; renderAtlas(); showToast(person.hidden ? &quot;人物卡已隐藏，可在已隐藏中恢复&quot; : &quot;人物卡已恢复&quot;); }
        }
        if (action === &quot;evidence&quot;) openEvidence();
        if (action === &quot;edit&quot;) openEdit();
        if (action === &quot;close-evidence&quot;) closeModal(&quot;#atlas-evidence-modal&quot;);
        if (action === &quot;close-edit&quot;) closeModal(&quot;#atlas-edit-modal&quot;);
        if (action === &quot;open-lab&quot;) { openModal(&quot;#atlas-lab-modal&quot;, &#x27;[data-action=&quot;close-lab&quot;]&#x27;); refreshIcons(); }
        if (action === &quot;close-lab&quot;) closeModal(&quot;#atlas-lab-modal&quot;);
        if (action === &quot;lab-replay&quot;) { closeModal(&quot;#atlas-lab-modal&quot;); clearPersistedDemo(); setScreen(&quot;welcome&quot;); showToast(&quot;冷启动已重置&quot;); }
        if (action === &quot;lab-error&quot;) { closeModal(&quot;#atlas-lab-modal&quot;); startScan(false, &quot;error&quot;, 30); }
        if (action === &quot;lab-empty&quot;) {
          closeModal(&quot;#atlas-lab-modal&quot;);
          state.demoLimit = 0;
          state.partial = false;
          state.index = 0;
          renderAtlas();
          showToast(&quot;已切换为空图鉴测试档&quot;);
        }
        if (action === &quot;lab-restore&quot;) { closeModal(&quot;#atlas-lab-modal&quot;); restorePeople(); renderAtlas(); showToast(&quot;已恢复 8 张示例卡&quot;); }
        if (action === &quot;lab-clear&quot;) { closeModal(&quot;#atlas-lab-modal&quot;); clearPersistedDemo(); restorePeople(); setScreen(&quot;welcome&quot;); showToast(&quot;全部体验状态已清除&quot;); }
      }

      function handleKeydown(event) {
        const openLayer = root.querySelector(&quot;.atlas-modal-layer.is-open&quot;);
        if (openLayer &amp;&amp; event.key === &quot;Tab&quot;) {
          const focusable = Array.from(openLayer.querySelectorAll(&#x27;button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [href]&#x27;));
          if (!focusable.length) return;
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          if (event.shiftKey &amp;&amp; document.activeElement === first) { event.preventDefault(); last.focus(); }
          if (!event.shiftKey &amp;&amp; document.activeElement === last) { event.preventDefault(); first.focus(); }
          return;
        }
        if (event.key === &quot;Escape&quot;) {
          const openModalLayer = root.querySelector(&quot;.atlas-modal-layer.is-open&quot;);
          if (openModalLayer) closeModal(&quot;#&quot; + openModalLayer.id);
          return;
        }
        if (root.dataset.screen === &quot;unlock&quot; &amp;&amp; (event.key === &quot;Enter&quot; || event.key === &quot; &quot;) &amp;&amp; event.target.closest(&#x27;[data-action=&quot;reveal-card&quot;]&#x27;)) {
          event.preventDefault();
          event.target.closest(&#x27;[data-action=&quot;reveal-card&quot;]&#x27;).click();
          return;
        }
        if (root.dataset.screen !== &quot;atlas&quot; || root.querySelector(&quot;.atlas-modal-layer.is-open&quot;)) return;
        if (event.key === &quot;/&quot; &amp;&amp; !event.target.matches(&quot;input, textarea&quot;)) { event.preventDefault(); root.querySelector(&quot;#atlas-search-input&quot;).focus(); }
        if (event.target.matches(&quot;input, textarea&quot;)) return;
        if (event.key === &quot;ArrowLeft&quot;) { event.preventDefault(); moveDeck(-1); }
        if (event.key === &quot;ArrowRight&quot;) { event.preventDefault(); moveDeck(1); }
        if (event.key === &quot; &quot;) {
          event.preventDefault();
          const center = root.querySelector(&#x27;.atlas-person-card[data-position=&quot;center&quot;]&#x27;);
          if (center) center.classList.toggle(&quot;is-flipped&quot;);
        }
      }

      root.addEventListener(&quot;click&quot;, handleRootClick);
      root.addEventListener(&quot;keydown&quot;, handleKeydown);
      root.querySelector(&quot;#atlas-search-input&quot;).addEventListener(&quot;input&quot;, function searchInput(event) { state.query = event.target.value.trim(); state.index = 0; renderAtlas(); });
      root.querySelector(&quot;#atlas-edit-form&quot;).addEventListener(&quot;submit&quot;, saveEdit);
      root.querySelectorAll(&quot;.atlas-modal-layer&quot;).forEach(function modalBackdrop(layer) { layer.addEventListener(&quot;click&quot;, function closeOnBackdrop(event) { if (event.target === layer) closeModal(&quot;#&quot; + layer.id); }); });
      root.querySelector(&quot;#atlas-deck-viewport&quot;).addEventListener(&quot;pointerdown&quot;, function beginSwipe(event) { state.pointerStartX = event.clientX; });
      root.querySelector(&quot;#atlas-deck-viewport&quot;).addEventListener(&quot;pointerup&quot;, function finishSwipe(event) {
        if (state.pointerStartX === null) return;
        const distance = event.clientX - state.pointerStartX;
        state.pointerStartX = null;
        if (Math.abs(distance) &lt; 48) return;
        moveDeck(distance &gt; 0 ? -1 : 1);
      });

      function restorePersistedDemo() {
        let saved;
        try {
          saved = JSON.parse(window.sessionStorage.getItem(storageKey) || &quot;null&quot;);
        } catch (error) {
          return;
        }
        if (!saved || typeof saved !== &quot;object&quot;) return;
        if (Array.isArray(saved.people) &amp;&amp; saved.people.length) {
          people.splice(0, people.length);
          saved.people.forEach(function restoreSavedPerson(person) { people.push(person); });
        }
        state.demoLimit = typeof saved.demoLimit === &quot;number&quot; ? saved.demoLimit : null;
        state.partial = Boolean(saved.partial);
        if (saved.screen === &quot;scan&quot; &amp;&amp; saved.scanProgress &gt; 0 &amp;&amp; saved.scanProgress &lt; 100) {
          startScan(Boolean(saved.resyncing), &quot;normal&quot;, Number(saved.scanProgress));
          toggleScan();
          root.querySelector(&quot;#atlas-scan-caption&quot;).textContent = &quot;检测到上次中断，进度已恢复，可继续扫描&quot;;
          showToast(&quot;已恢复上次扫描进度&quot;);
          return;
        }
        if (saved.screen === &quot;atlas&quot;) { setScreen(&quot;atlas&quot;); renderAtlas(); }
      }

      restorePersistedDemo();
      window.setTimeout(refreshIcons, 50);
    }());
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
